version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  ai-agent:
    build:
      context: ../medical-ai-agent
      dockerfile: Dockerfile.simple
    ports:
      - "8001:8001"
    env_file:
      - ../medical-ai-agent/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai-agent
    restart: unless-stopped
