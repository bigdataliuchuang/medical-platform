# gitleaks configuration for medical-platform
# https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[allowlist]
description = "Allow placeholder values in example/template files"
paths = [
    '''\.env\.example$''',
    '''docs/.*\.md$''',
]

regexes = [
    '''change-this-to-a-random-secret''',
    '''test-secret-key-for-github-actions''',
    '''dummy-ci-key''',
]
