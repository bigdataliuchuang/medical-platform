name: CI - medical-platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Lint with flake8
      continue-on-error: true
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy
      continue-on-error: true
      run: |
        cd backend
        mypy main.py auth.py db.py routers/ || true

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm install

    - name: Lint with ESLint
      continue-on-error: true
      run: |
        cd frontend
        npm run lint || echo "ESLint check completed with warnings"

    - name: Type check with TypeScript
      run: |
        cd frontend
        npx tsc --noEmit

    - name: Build
      run: |
        cd frontend
        npm run build

  docker-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Checkout medical-ai-agent repo
      uses: actions/checkout@v4
      with:
        repository: bigdataliuchuang/medical-ai-agent
        path: ../medical-ai-agent

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Create .env files for docker compose
      run: |
        # Backend .env (use localhost for database)
        cat > backend/.env << 'EOF'
        DORIS_HOST=localhost
        DORIS_PORT=9030
        DORIS_USER=root
        DORIS_PASSWORD=test
        DORIS_DATABASE=test
        JWT_SECRET=test-secret-key-for-github-actions
        JWT_EXPIRE_MINUTES=480
        ADMIN_USERNAME=admin
        ADMIN_PASSWORD_HASH=
        EOF

        # Note: medical-ai-agent runs independently in its own CI job

    - name: Build docker images
      run: |
        cd medical-platform
        docker compose build --no-cache

    - name: Start services (docker compose up -d)
      run: |
        cd medical-platform
        docker compose up -d
        sleep 15

    - name: Check running containers
      run: docker ps

    - name: Health check - Frontend
      run: curl -f http://localhost:3000 || echo "Frontend not immediately responsive (nginx startup)"

    - name: Health check - Backend API
      run: curl -f http://localhost:8000/health || curl -f http://localhost:8000/docs || echo "Backend health check skipped"

    - name: Check logs for errors
      run: |
        echo "=== Backend logs ===" && docker compose -f medical-platform/docker-compose.yml logs backend || true
        echo "=== Frontend logs ===" && docker compose -f medical-platform/docker-compose.yml logs frontend || true
        echo "=== AI Agent logs ===" && docker compose -f medical-platform/docker-compose.yml logs ai-agent || true

    - name: Cleanup
      if: always()
      run: |
        cd medical-platform
        docker compose down -v || true
