name: CI - medical-platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install flake8 mypy

    - name: Lint with flake8
      continue-on-error: true
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy
      continue-on-error: true
      run: |
        cd backend
        mypy main.py auth.py db.py routers/ || true

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm install

    - name: Lint with ESLint
      continue-on-error: true
      run: |
        cd frontend
        npm run lint || echo "ESLint check completed with warnings"

    - name: Type check with TypeScript
      run: |
        cd frontend
        npx tsc --noEmit

    - name: Build
      run: |
        cd frontend
        npm run build

  docker-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Checkout AI Agent repository
      uses: actions/checkout@v4
      with:
        repository: bigdataliuchuang/medical-ai-agent
        path: medical-ai-agent
        token: ${{ secrets.MEDICAL_AI_AGENT_TOKEN || github.token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Create .env files for docker compose
      run: |
        # Backend .env (use localhost for database)
        cat > backend/.env << 'EOF'
        DORIS_HOST=localhost
        DORIS_PORT=9030
        DORIS_USER=root
        DORIS_PASSWORD=test
        DORIS_DATABASE=test
        JWT_SECRET=test-secret-key-for-github-actions
        JWT_EXPIRE_MINUTES=480
        ADMIN_USERNAME=admin
        ADMIN_PASSWORD_HASH=
        EOF

        # AI Agent .env (use dummy LLM credentials; CI only checks startup/docs/health)
        cat > medical-ai-agent/.env << 'EOF'
        LLM_PROVIDER=anthropic
        ANTHROPIC_API_KEY=dummy-ci-key
        LLM_MODEL=claude-haiku-4-5-20251001
        LLM_MAX_TOKENS=1024
        LLM_TIMEOUT=30
        DORIS_HOST=localhost
        DORIS_PORT=9030
        DORIS_USER=root
        DORIS_PASSWORD=test
        DORIS_DATABASE=test
        DORIS_MAX_ROWS=100
        MILVUS_HOST=localhost
        MILVUS_PORT=19530
        MILVUS_COLLECTION=medical_schema
        EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
        SQL_WHITELIST_TABLES=ads_dq_result_summary,ads_patient_mpi_summary,ads_drug_usage_trend,ads_tumor_report_monthly,ads_expense_by_tumor_type,ads_inpatient_quality_board,dq_check_result,dq_issue_detail,mpi_cross_reference
        SESSION_DB_PATH=data/sessions.db
        SESSION_MAX_TURNS=10
        SESSION_TIMEOUT_MINUTES=30
        EOF

    - name: Build docker images
      run: |
        docker compose -f docker-compose.ci.yml build --no-cache

    - name: Start services (docker compose up -d)
      run: |
        docker compose -f docker-compose.ci.yml up -d
        sleep 15

    - name: Check running containers
      run: docker ps

    - name: Health check - Frontend
      run: curl -f http://localhost:3000 || echo "Frontend not immediately responsive (nginx startup)"

    - name: Health check - Backend API
      run: curl -f http://localhost:8000/health || curl -f http://localhost:8000/docs || echo "Backend health check skipped"

    - name: Health check - AI Agent
      run: |
        curl -f http://localhost:8001/docs
        curl -f http://localhost:8001/api/health

    - name: Check logs for errors
      run: |
        echo "=== Backend logs ===" && docker compose -f docker-compose.ci.yml logs backend || true
        echo "=== AI Agent logs ===" && docker compose -f docker-compose.ci.yml logs ai-agent || true
        echo "=== Frontend logs ===" && docker compose -f docker-compose.ci.yml logs frontend || true

    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.ci.yml down -v || true
